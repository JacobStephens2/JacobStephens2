        - listitem [ref=e211]:
          - link "terraform-cloudflare-dns" [ref=e212] [cursor=pointer]:
            - /url: https://github.com/JacobStephens2/terraform-cloudflare-dns
          - text: ": Infrastructure-as-code for a personal web fleet of ~70 hostnames across 10 domains. Consolidated DNS from four registrars onto Cloudflare and brought ~220 records across 9 zones under Terraform by importing the live records (not recreating them) for a zero-downtime, no-op baseline plan. Remote state on AWS S3 kept off the compute provider for disaster-recovery independence, Ansible roles for one-command subdomain provisioning, a plan-only DigitalOcean rebuild blueprint, and GitHub Actions plan-on-PR. Sanitized public mirror of the production repo"
        - listitem [ref=e213]:
          - link "k3s-demo" [ref=e214] [cursor=pointer]:
            - /url: https://github.com/JacobStephens2/k3s-demo
          - text: ": The Kubernetes Demo: a separate single-node k3s learning and portfolio environment, not ETA production. It runs a live, HTTPS two-tier app - a stateless Deployment in front of a Redis StatefulSet - provisioned end to end by Terraform and cloud-init. Production-grade manifests (rolling updates, liveness/readiness probes, resource limits, a hardened securityContext, a HorizontalPodAutoscaler, and RBAC), with an interactive page that triggers a load test and charts CPU crossing the 70% target as the pods scale 2 to 6 ("
          - link "k3s-demo.stephens.page" [ref=e215] [cursor=pointer]:
            - /url: https://k3s-demo.stephens.page
          - text: ). Guarded by a five-rule OPA Gatekeeper admission layer, one rule re-expressed as a ValidatingAdmissionPolicy in CEL
