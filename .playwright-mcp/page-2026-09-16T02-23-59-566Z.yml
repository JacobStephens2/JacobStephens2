      - heading "Senior Platform & Infrastructure Engineer" [level=3] [ref=e161]
      - paragraph [ref=e162]:
        - link "Educational Travel Adventures" [ref=e163] [cursor=pointer]:
          - /url: https://etadventures.com/
        - text: "| Feb 2022 - Present | United States, Remote"
      - list [ref=e164]:
        - listitem [ref=e165]: I lead a two-engineer team owning the company's production stack - reservations platform, payment processing, Linux server fleet, and deployment pipeline - with end-to-end responsibility for architecture, operations, and on-call response across a multi-million-dollar travel business
        - listitem [ref=e166]:
          - text: Developed
          - link "guides.etadventures.com" [ref=e167] [cursor=pointer]:
            - /url: https://guides.etadventures.com/
          - text: "- a mobile-first PWA for field contractors with offline service-worker support, receipt-attached expense workflows, and manager admin; adopted by 77 guides over the past 12 months to file 410 tour reports, send 3,300+ traveler SMS, and process 1,800+ expense reports (~$154K), extending the JavaScript stack across a previously PHP-only platform"
        - listitem [ref=e168]: Architected automated reservation-cancellation workflows in PHP and MySQL, preventing bad-debt accumulation with business-rule-driven automation
        - listitem [ref=e169]: Turned hard-coded email and voice payment reminders into a manager-editable system - self-service rules in the Tourbot UI, added Twilio SMS, wired to automated cancellation - cutting manual work by 80%+
        - listitem [ref=e170]:
          - text: "Drove production-database performance from measurement: caching and query work took alert pages from 5-10 seconds to under 1 second, and a"
          - code [ref=e171]: performance_schema
          - text: "-led index pass (online DDL, zero downtime) eliminated ~80% of measured query time on the live primary; a profile-driven N+1 elimination pass on the group-manifest page cut SQL statements per request from ~2,650 to ~183 with byte-identical HTML output"
        - listitem [ref=e172]: "Led PCI compliance initiative: architected secure REST integrations with merchant payment processors, and inherited, improved, and modernized the ACH/NACHA bank-file workflows (SFTP) across PHP, MySQL, and OS major-version migrations, implementing security best practices including bank-account encryption"
        - listitem [ref=e173]: Led three enterprise-wide platform migrations (PHP 5 -> 8, MySQL 5 -> 8, and CentOS 7 -> Rocky Linux 9) across the codebase and server fleet, modernizing the stack and improving application performance
        - listitem [ref=e174]: Established engineering practices across internal and customer-facing platforms - architecture decisions, code review, and mentoring two developers
        - listitem [ref=e175]: Built an internal orchestration and status platform (Python, Flask, SQLite) - a dashboard that probes the MySQL, web, and cron-server fleet every 60 seconds with operator deploy and preview-environment controls - running an autonomous coding agent as a scoped, least-privilege system user with auditable, vault-injected credentials
        - listitem [ref=e176]: "Stood up fleet-wide observability on a Terraform-provisioned droplet - Prometheus, Grafana, and Alertmanager instrumenting 14 hosts (node/mysqld/blackbox exporters: uptime, replication health, TLS expiry) with email and SMS paging consolidated into a single alert pipeline"
        - listitem [ref=e177]:
          - text: Designed and built three Manager Sandboxes - role-specific Tourbot instances in Docker containers behind Traefik for Sales, General Management, and Marketing - each with an isolated database, few-hour production refresh, per-container resource limits, and default-deny agent command execution; AI work is isolated on per-role branches behind a human merge gate through which 14 manager-prototyped features shipped to production. No agent approves, merges, deploys, or moves money without a named human gate - the
          - link "seven-boundary safety checklist" [ref=e178] [cursor=pointer]:
            - /url: https://github.com/JacobStephens2/infrastructure-patterns
          - text: governing this is published as sanitized ADRs and a
          - link "pattern write-up" [ref=e179] [cursor=pointer]:
            - /url: https://stephens.page/notes/human-in-the-loop-ai-agents/
        - listitem [ref=e180]:
          - text: Replaced database triggers with binlog-tailing daemons for derived reporting data - reconciliation pipelines that keep denormalized tables consistent with the transactional source, in versioned code off the hot write path (
          - link "ADR 0006" [ref=e181] [cursor=pointer]:
            - /url: https://github.com/JacobStephens2/infrastructure-patterns/blob/main/adr/0006-binlog-daemons-over-database-triggers.md
          - text: )
        - listitem [ref=e182]: Built ProspectForge - an internal contact-sourcing platform (FastAPI, SQLAlchemy 2.0, Alembic, PostgreSQL, Next.js, self-hosted Firecrawl scraping, Docker Compose) to replace CivicIQ, the team's third-party prospecting SaaS, pending management approval
        - listitem [ref=e183]: Engineered a server-side deploy pipeline with dirty-worktree rejection, flock-based concurrency serialization, ancestor-only ref enforcement, post-deploy healthcheck, and one-command rollback - backed by a PHPUnit suite (unit / integration / functional) and GitHub Actions CI across PHP 8.1-8.4
