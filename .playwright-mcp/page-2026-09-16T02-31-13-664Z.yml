              - paragraph [ref=e204]: A Python and Flask service that probes Educational Travel Adventures' fleet of web, database, and cron servers and renders a single-page health view - paired with a hardened Linux host that lets a Claude Code agent operate safely across that infrastructure.
              - generic [ref=e205]:
                - strong [ref=e206]: Problem
                - generic [ref=e207]: A dozen production and supporting servers - MySQL 8 and 5.7, Apache, ACH cron processing, Docker-hosted Manager Sandboxes, an asset host - with no single place to see what was reachable, green, or degrading, and no clean way to give an AI agent multi-server access without leaking credentials or muddying audit logs.
              - generic [ref=e208]:
                - strong [ref=e209]: What I Built
                - generic [ref=e210]: "A Flask app behind Caddy and gunicorn that sweeps TCP, HTTP, and MySQL probes every 60 seconds across the fleet, with deploy controls, fleet-wide tmux management, and a web terminal - all gated by single-use magic-link tokens. The same VM runs a hardened service-account pipeline: secrets injected at launch from a managed vault, database grants scoped to least privilege, and a wrapper that lets engineers trigger the agent without ever handling its credentials. Auditing reads as \"the orchestrator did X,\" not \"Engineer Y did X via it.\""
              - generic [ref=e211]:
                - strong [ref=e212]: Result
                - generic [ref=e213]: One URL to check fleet health, refreshed in the background so page loads never block on a probe - and a controlled launchpad from which an AI agent can coordinate work between web and database servers with credentials it never sees on disk.
