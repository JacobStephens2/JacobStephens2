                  - text: Six rounds, each starting from an xdebug cachegrind capture and ending with a byte-identical HTML diff. Collapsed 118 per-request MySQL connections into one via the shared PDO handle. Made
                  - code [ref=e297]: Booking::__construct
                  - text: skippable so 50 passengers hydrate from a single batched
                  - code [ref=e298]: IN(…)
                  - text: query, and added a
                  - code [ref=e299]: Price_statement::prefetch()
                  - text: layer - static caches and batched queries warmed once per request, with per-instance fallbacks for other callers. Replaced a leading-wildcard
                  - code [ref=e300]: LIKE
                  - text: in the cancellation-history query with an
                  - code [ref=e301]: Action_Type
