            - 'heading "Tourbot Chat: Manager Sandboxes" [level=3] [ref=e72]'
            - generic [ref=e73]:
              - paragraph [ref=e74]: Tourbot Chat runs inside three Manager Sandboxes - role-specific Tourbot instances in Docker containers for Sales, General Management, and Marketing - giving managers natural-language access to business intelligence and a safe place to prototype platform changes.
              - generic [ref=e75]:
                - strong [ref=e76]: Problem
                - generic [ref=e77]: Managers needed to answer complex business questions - revenue breakdowns, booking trends, vendor performance - without waiting on developer time. They also wanted to experiment with reports and workflows on their own terms, without risking the production system.
              - generic [ref=e78]:
                - strong [ref=e79]: What I Built
                - generic [ref=e80]: "Each Manager Sandbox runs a role-specific Tourbot instance in its own Docker container, fronted by Traefik, with a dedicated Claude-powered OpenClaw agent. Agents query a replica of the production database refreshed once daily, run analysis, generate reports, and even modify PHP code, all isolated by role: allowlist-controlled command execution, dedicated least-privilege database users, and a git-based review gate so nothing reaches production unreviewed. Each container is provisioned from a shared compose definition, so standing up a new Manager Sandbox is a one-command operation."
              - generic [ref=e81]:
                - strong [ref=e82]: Result
                - generic [ref=e83]: Non-technical managers independently explore business data, generate custom reports, and prototype workflow changes through plain conversation - 14 manager-prototyped features have shipped to production through the human merge gate across Sales, General Management, and Marketing, with zero agent-caused incidents - while the system enforces per-role isolation, read-only data access, and code-review boundaries that keep the production platform safe from accidental or unreviewed change.
