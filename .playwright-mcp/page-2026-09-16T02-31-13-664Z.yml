            - generic [ref=e139]:
              - paragraph [ref=e140]: "An agentic engineering platform for Educational Travel Adventures: small, self-describing staff requests in; Factory Workers are agent attempts running in short-lived Firecracker microVMs; evidenced draft pull requests out. One human gate - the PR - held by engineering and the company owner. The production deploy path is never touched."
              - generic [ref=e141]:
                - strong [ref=e142]: Problem
                - generic [ref=e143]: Useful Tourbot changes die in inboxes because every request needs engineer time end to end. Managers already prototype inside sandboxed agents, but the company needed a purpose-built pipeline that turns a staff request into a reviewable PR - with isolation strong enough that untrusted screenshots and agent-written code never sit next to crown-jewel credentials.
              - generic [ref=e144]:
                - strong [ref=e145]: What I Built
                - generic [ref=e146]:
                  - text: A Rust control plane (Axum supervisor, dashboard,
                  - code [ref=e147]: factoryctl
                  - text: ) on a dedicated host with socket-only PostgreSQL, an append-only ledger, and a draft-only publisher under a GitHub App machine identity. Each agent attempt becomes a Factory Worker executing implement and verify work inside a short-lived Firecracker microVM, separate from the Docker-based Manager Sandboxes. Evidence capture, adversarial cross-family review, and a constitution (
                  - code [ref=e148]: AGENTS.md
                  - text: ) SHA-pinned in CI keep every run attributable. Phase 1 sessions covering isolation, verifier, publisher, dashboard, and the evidence lifecycle are merged on live infrastructure.
              - generic [ref=e149]:
                - strong [ref=e150]: Result
                - generic [ref=e151]: "Phase 1 runs on live hosts: control plane, Factory Worker path, draft-only publisher, and evidence path are real infrastructure - not a design deck - with the constitution and merge gate enforced in code. The intended loop is staff request → evidenced draft PR; review is the only human cost, and nothing auto-merges or deploys. End-to-end staff adoption is still the build's target, not a claimed steady-state metric. The trust model is written up interactively in public posts on the factory as a canonical model and as multi-engine discrete-event animation."
