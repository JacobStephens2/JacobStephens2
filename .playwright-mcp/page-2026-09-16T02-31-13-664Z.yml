            - generic [ref=e692]:
              - paragraph [ref=e693]: A Flask web app that turns a Markdown document into an MP3 you can listen to, narrated by a neural text-to-speech model running entirely on my own server - no third-party API, and no text or audio ever leaves the box.
              - generic [ref=e694]:
                - strong [ref=e695]: Problem
                - generic [ref=e696]: I wanted to listen to long Markdown notes and documents as audio, but the obvious route - a hosted TTS API - means shipping the full text to a third party and paying per character. I wanted the same result with the text never leaving a server I control.
              - generic [ref=e697]:
                - strong [ref=e698]: What I Built
                - generic [ref=e699]:
                  - text: Paste Markdown (or upload a
                  - code [ref=e700]: .md
                  - text: ), pick a voice, and convert to a downloadable MP3. Synthesis runs on a self-hosted Kokoro-82M (ONNX) model in its own loopback-bound service, so no text or audio leaves the server and there is no external AI dependency or per-use cost. A Library keeps each rendering alongside its source-Markdown sidecar; sharing is via revocable capability-URL tokens (
                  - code [ref=e701]: /share/<token>
                  - text: ") - the only thing ever made public is a link you create and can revoke. Built as a seven-boundary safety demo: it never emails, posts, or acts on your behalf."
