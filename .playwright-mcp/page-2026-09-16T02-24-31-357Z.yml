  - paragraph [ref=f3e13]:
    - text: AI coding agents need secret values (API keys and related credentials). Many setups put those values in local
    - code [ref=f3e14]: .env
    - text: files.
    - strong [ref=f3e15]: vaulted-agent
    - text: is a
    - strong [ref=f3e16]: launcher
    - text: (
    - code [ref=f3e17]: va
    - text: ). It is not a long-running daemon. You select a
    - strong [ref=f3e18]: harness
    - text: . The launcher resolves a
    - strong [ref=f3e19]: manifest
    - text: from a vault
    - strong [ref=f3e20]: backend
    - text: ", builds the"
    - strong [ref=f3e21]: child environment
    - text: ", and"
    - code [ref=f3e22]: exec
    - text: s the agent. Secret values stay in that process. They are not stored as a local secret file for each tool.
  - figure [ref=f3e23]:
    - 'img "Illustration: the vaulted-agent launcher resolves secret values from a vault into the child environment, then execs an agent" [ref=f3e24]'
