  - heading "Recipes" [level=2] [ref=f3e112]
  - heading "Add one secret mapping to a harness" [level=3] [ref=f3e113]
  - paragraph [ref=f3e114]: The harness points at a manifest. The vault holds the secret value. The refs file holds only the mapping (env var → reference). Do not put secret values in the refs file.
  - list [ref=f3e115]:
    - listitem [ref=f3e116]:
      - strong [ref=f3e117]: Create the secret in the vault
      - paragraph [ref=f3e118]: "Bitwarden Secrets Manager: create a secret. Keep the name or UUID. 1Password: create an item field that the service account can read."
    - listitem [ref=f3e119]:
      - strong [ref=f3e120]: Map it in a refs file
      - generic [ref=f3e121]:
        - button "Copy refresh" [ref=f3e122] [cursor=pointer]
        - code [ref=f3e127]: "# Merge unmapped secrets into the refs file va refresh # Or replace the refs file for one backend: va refresh --backend onepassword --replace --all # Edit the refs file with checks: va edit-manifest # or: va edit-manifest full.env.tpl # Or add one line under /etc/vaulted-agent/manifests/: # Bitwarden: OPENAI_API_KEY=name:openai-api-key # 1Password: OPENAI_API_KEY=op://Vault/openai/credential # Do not put sample op://… in comments. op inject reads comments."
    - listitem [ref=f3e128]:
      - strong [ref=f3e129]: Set the harness manifest
      - paragraph [ref=f3e130]:
        - text: Example in
        - code [ref=f3e131]: /etc/vaulted-agent/harnesses.d/claude.conf
        - text: ":"
        - code [ref=f3e132]: manifest = full.env.tpl
        - text: . If you change only the secret value in the vault, run no command. The next launch fetches the new value. If you add a new mapping, run
        - code [ref=f3e133]: va refresh
        - text: or
        - code [ref=f3e134]: va edit-manifest
        - text: .
  - heading "Use a manifest override for one launch" [level=3] [ref=f3e135]
  - paragraph [ref=f3e136]:
    - text: The harness still sets the command, workdir, and backend. The
    - strong [ref=f3e137]: manifest override
    - text: replaces the harness manifest for this launch. It does not merge with the configured manifest.
  - generic [ref=f3e138]:
    - button "Copy -m launch" [ref=f3e139] [cursor=pointer]
    - code [ref=f3e144]: "# Launcher flag before the harness name (not after) va -m readonly.env.tpl claude va --manifest=/etc/vaulted-agent/manifests/narrow.env.tpl claude --resume <id> # Also with pick: va -m readonly.env.tpl pick"
  - paragraph [ref=f3e145]:
    - text: A relative name is under
    - code [ref=f3e146]: /etc/vaulted-agent/manifests/
    - text: . A missing file fails before the agent starts. The launcher prints the manifest in use. Do not use
    - code [ref=f3e147]: "-m"
    - text: under a
    - strong [ref=f3e148]: conductor link
    - text: (
    - code [ref=f3e149]: "*-conductor"
    - text: ). That path has a fixed entitlement. Use the direct
    - code [ref=f3e150]: va
    - text: binary for a manifest override.
  - heading "Commands" [level=2] [ref=f3e151]
  - generic [ref=f3e152]:
    - button "Copy commands" [ref=f3e153] [cursor=pointer]
    - code [ref=f3e158]: "va # list harnesses va agy # Antigravity CLI (workdir = caller) va muse # Muse Code with its configured permissions va muse --yolo # inject secrets, then use Muse native yolo mode va bash # secrets-injected shell (or va bash ./script.sh) va doctor # config / syntax as the launch user (offline) va secrets validate # resolve every harness + extra_manifest (live) va secrets validate --offline # shape only; no manager token va secrets list # Bitwarden SM va refresh # write or update a refs file va edit-manifest # edit a refs file; check on save va -m readonly.env.tpl claude # manifest override for this launch va auth-mode prompt # or: file va update # update binary and add missing detected harnesses va update --sync-harnesses # add missing harnesses without a binary download va run -m REFS --backend bitwarden -p -- your-cmd sudo va uninstall"
  - paragraph [ref=f3e159]:
    - strong [ref=f3e160]: "Upgrading from v0.4.23 or earlier:"
    - text: run
    - code [ref=f3e161]: va update
    - text: ", then"
    - code [ref=f3e162]: va update --sync-harnesses
    - text: once to add missing harnesses such as Muse. Later updates handle both steps automatically. Existing profiles are preserved. New harnesses reuse the backend and manifest only when existing profiles agree; otherwise they start without secrets and print a configuration reminder.
  - paragraph [ref=f3e163]:
    - strong [ref=f3e164]: "Bitwarden:"
    - text: use a Machine Account access token (
    - code [ref=f3e165]: BWS_ACCESS_TOKEN
    - text: ) as the manager token. Do not use your personal vault password. Refs file lines look like
    - code [ref=f3e166]: OPENAI_API_KEY=name:openai-api-key
    - text: .
    - strong [ref=f3e167]: "1Password:"
    - text: put the service account token in
    - code [ref=f3e168]: OP_SERVICE_ACCOUNT_TOKEN
    - text: .
    - code [ref=f3e169]: va refresh
    - text: lists items, asks which to include, and writes
    - code [ref=f3e170]: VAR=op://VAULT/ITEM/FIELD
    - text: lines. If you change only a secret value in the vault, run no command. If you add a mapping, run
    - code [ref=f3e171]: va refresh
    - text: or
    - code [ref=f3e172]: va edit-manifest
    - text: .
    - code [ref=f3e173]: va secrets validate
    - text: "is the pre-flight gate: it uses the same resolve path as a launch and fails closed if the vault is unreachable. Use"
    - code [ref=f3e174]: "--offline"
    - text: only for shape checks. A harness may set
    - code [ref=f3e175]: alias = TARGET = SOURCE
    - text: so one shared refs file can serve agents that hardcode different meanings for the same name.
    - code [ref=f3e176]: va doctor
    - text: stays offline by design (syntax and config). Doctor also flags
    - code [ref=f3e177]: op://
    - text: tokens in comments (
    - code [ref=f3e178]: op inject
    - text: resolves comments).
  - paragraph [ref=f3e179]:
