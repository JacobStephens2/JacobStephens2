  - heading "Launch path" [level=2] [ref=f3e197]
  - paragraph [ref=f3e198]:
    - text: "The harness is the unit of launch configuration. It names a command and a manifest. The launch path is: scrub → resolve → drop the manager token → exec. If a service user is set, the launcher re-execs with"
    - code [ref=f3e199]: sudo -u
    - text: first. Secret values live in the child environment until the process exits. Compare manifests to see which harness can resolve which references.
  - generic "Launch path" [ref=f3e200]: "you $ va claude --resume <id> │ ▼ /usr/local/bin/vaulted-agent (alias: va) ├─ optional sudo -u <service> service-user re-exec ├─ cd workdir caller cwd by default ├─ scrub environment child environment allowlist only ├─ load manager token op.env / bws.env, or prompt (auth mode) ├─ resolve manifest op inject / bws secret get / … ├─ drop manager token must not enter the child environment └─ exec claude … --resume <id> └─ secret values stay here until exit"
