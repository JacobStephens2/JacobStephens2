  - list [ref=f3e54]:
    - listitem [ref=f3e55]:
      - strong [ref=f3e56]: Install the launcher
      - generic [ref=f3e57]:
        - button "Copy install" [ref=f3e58] [cursor=pointer]
        - code [ref=f3e63]: curl -fsSL https://vaultedagent.com/install.sh | bash
      - paragraph [ref=f3e64]:
        - text: "Supported systems: macOS and Linux. The install script pins release"
        - code [ref=f3e65]: v0.4.24
        - text: . Linux assets are static musl binaries. The installer can create harnesses for agents found on
        - code [ref=f3e66]: PATH
        - text: .
    - listitem [ref=f3e67]:
      - strong [ref=f3e68]: Configure a backend
      - generic [ref=f3e69]:
        - button "Copy setup" [ref=f3e70] [cursor=pointer]
        - code [ref=f3e75]: va setup va doctor
      - paragraph [ref=f3e76]:
        - code [ref=f3e77]: va setup
        - text: selects a backend (Bitwarden SM, 1Password, pass, or sops), auth mode, optional service user, and workdir (
        - code [ref=f3e78]: caller
        - text: or a fixed path).
        - code [ref=f3e79]: va doctor
        - text: checks the config as the same user a launch would use.
        - code [ref=f3e80]: va refresh
        - text: writes or updates a refs file for Bitwarden or 1Password. A refs file holds env var → reference lines only. Do not put secret values in a refs file. If the refs file is root-owned, refresh stops before vault work and prints
        - code [ref=f3e81]: sudo /usr/local/bin/vaulted-agent refresh
        - text: . Item menus accept ranges such as
        - code [ref=f3e82]: 1-5, 9
        - text: . Use
        - code [ref=f3e83]: va refresh --exclude '*_USERNAME'
        - text: to skip field names. To edit a refs file with checks, run
        - code [ref=f3e84]: va edit-manifest
        - text: (uses
        - code [ref=f3e85]: sudoedit
        - text: when you cannot write the file).
    - listitem [ref=f3e86]:
      - strong [ref=f3e87]: Start a harness
      - generic [ref=f3e88]:
        - button "Copy launch" [ref=f3e89] [cursor=pointer]
        - code [ref=f3e94]: va claude va codex va grok va kimi va agy va muse va muse --yolo va bash
      - paragraph [ref=f3e95]:
        - text: Muse runs with its configured permissions by default;
        - code [ref=f3e96]: va muse --yolo
        - text: forwards Muse’s native flag unchanged. With auth mode
        - code [ref=f3e97]: prompt
        - text: ", paste the manager token when asked. Use"
        - code [ref=f3e98]: va -p grok
        - text: once to force prompt auth. A
        - strong [ref=f3e99]: manifest override
        - text: "for this launch only:"
        - code [ref=f3e100]: va -m readonly.env.tpl claude
        - text: (launcher flag before the harness name). A
        - strong [ref=f3e101]: conductor link
        - text: does not accept
        - code [ref=f3e102]: "-m"
        - text: or
        - code [ref=f3e103]: "-H"
        - text: . For prompt auth under a conductor link, set
        - code [ref=f3e104]: VAULTED_AGENT_PROMPT_AUTH=1
        - text: .
