  - heading "Context" [level=2] [ref=f3e34]
  - paragraph [ref=f3e35]:
    - text: A
    - strong [ref=f3e36]: harness
    - text: is a named launch profile (
    - code [ref=f3e37]: harnesses.d/<name>.conf
    - text: ). It names a
    - strong [ref=f3e38]: backend
    - text: ", a"
    - strong [ref=f3e39]: manifest
    - text: ", and a command. A"
    - strong [ref=f3e40]: manifest
    - text: is often a
    - strong [ref=f3e41]: refs file
    - text: ": lines such as"
    - code [ref=f3e42]: VAR=reference
    - text: with no secret values on disk. A
    - strong [ref=f3e43]: manager token
    - text: opens the vault (
    - code [ref=f3e44]: BWS_ACCESS_TOKEN
    - text: or
    - code [ref=f3e45]: OP_SERVICE_ACCOUNT_TOKEN
    - text: ). The launcher uses that token only to resolve secret values. The manager token must not appear in the child environment.
    - strong [ref=f3e46]: Auth mode
    - text: is
    - code [ref=f3e47]: file
    - text: (token on disk) or
    - code [ref=f3e48]: prompt
    - text: (paste on each launch). An optional
    - strong [ref=f3e49]: service user
    - text: runs the agent under
    - code [ref=f3e50]: sudo -u
