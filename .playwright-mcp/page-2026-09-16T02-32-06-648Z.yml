                    - /url: "#tracewake"
                - paragraph [ref=e484]: Tracewake turns a labeled issue into a reviewable pull request, unattended.
                - paragraph [ref=e485]:
                  - text: An operator labels an issue
                  - code [ref=e486]: ready-for-agent
                  - text: . On its next Cycle the Selector reads the tracker, decides whether that issue is Eligible, seeds a Run from it, and dispatches the Run to a box, where a coding agent works inside a microVM under a Termination Contract with five declared bounds. The Run's only output is a Proposal - a draft pull request - which the operator reviews. Nothing merges itself.
                - paragraph [ref=e487]: "It is the same problem OpenAI's Symphony poses, with the opposite bets: the label as the point of Handover rather than a workflow state, one Run at a time rather than ten, a fresh microVM per Iteration rather than a persistent workspace, a Termination Contract rather than a stall timer, Proposal-Only Output rather than a landing state, and a Journal that records why every decision went the way it did."
                - paragraph [ref=e488]:
                  - code [ref=e489]: CONTEXT.md
                  - text: is the vocabulary - every capitalised term above is defined there -
                  - code [ref=e490]: SPEC.md
                  - text: is the specification, stating Tracewake's bets side by side in the same terms as OpenAI's Symphony,
                  - code [ref=e491]: INSTALL.md
                  - text: is the Single-Host installation guide, and
                  - code [ref=e492]: docs/adr/
                  - text: holds the decisions, numbered, with the reasoning that produced them.
                - generic [ref=e493]:
                  - heading "Configuring an instance" [level=2] [ref=e494]
                  - 'link "Permalink: Configuring an instance" [ref=e495] [cursor=pointer]':
                    - /url: "#configuring-an-instance"
                - paragraph [ref=e498]:
                  - text: An instance is
                  - strong [ref=e499]: an env file plus a targets file
                  - text: ". Nothing in the code names a company, a host, a person or a repository: a value like that has exactly one right answer per instance and no right answer in the product, so a missing one stops the cycle at preflight with the value named rather than being filled in with somebody else's."
                  - code [ref=e500]: selector/tests/test_configuration.py
                  - text: "enforces that mechanically against every default in the shipping tree. The product ships no filled-in Instance: those two files are written on the Host."
