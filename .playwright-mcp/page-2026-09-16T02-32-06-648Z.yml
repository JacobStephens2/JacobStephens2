                - generic [ref=e571]:
                  - heading "What Tracewake refuses to do" [level=2] [ref=e572]
                  - 'link "Permalink: What Tracewake refuses to do" [ref=e573] [cursor=pointer]':
                    - /url: "#what-tracewake-refuses-to-do"
                - paragraph [ref=e576]: "The invariants that govern Tracewake are defined by what it guarantees and what it refuses to do:"
                - list [ref=e577]:
                  - listitem [ref=e578]:
                    - strong [ref=e579]: Proposal-Only Output (refuses autonomous merges)
                    - text: ": A Run's sole external output is a draft pull request (ADR 0013). A human operator reviews, tests, and merges every change. Nothing merges itself."
                  - listitem [ref=e580]:
                    - strong [ref=e581]: Subscription Credentials (refuses metered keys)
                    - text: ": Agents authenticate against flat-rate subscriptions, such as a 1-year"
                    - code [ref=e582]: CLAUDE_CODE_OAUTH_TOKEN
                    - text: or seat (ADR 0004, ADR 0020). Preflight refuses metered API keys (such as
                    - code [ref=e583]: ANTHROPIC_API_KEY
                    - text: ), eliminating runaway spend.
                  - listitem [ref=e584]:
                    - strong [ref=e585]: Secret Scans on Diff (refuses credential leaks)
                    - text: ":"
                    - code [ref=e586]: propose.sh
                    - text: inspects outgoing git diffs for known token patterns (such as
                    - code [ref=e587]: sk-ant-oat01-
                    - text: ) and refuses to publish a proposal containing them.
                  - listitem [ref=e588]:
                    - strong [ref=e589]: MicroVM Boundary (refuses unisolated execution)
                    - text: ": Every Iteration executes inside an isolated microVM or container with pinned network egress and an ephemeral filesystem (ADR 0003, ADR 0011)."
                  - listitem [ref=e590]:
                    - strong [ref=e591]: Out-of-Repo Configuration (refuses repo pollution)
                    - text: ": Target repositories carry zero Tracewake configuration files, workflow templates, or hooks. Configuration lives entirely on the controller."
                  - listitem [ref=e592]:
                    - strong [ref=e593]: Termination Contract (refuses unverified done signals)
                    - text: ": A Run terminates only when one of its five declared Contract bounds binds (ADR 0007). A model's \"Completion Promise\" is advisory and never ends a Run or claims done on its own."
                  - listitem [ref=e594]:
                    - strong [ref=e595]: Explicit Instance Config (refuses guessed defaults)
                    - text: ": Missing required instance or target configuration aborts the cycle immediately at preflight with the missing key named, refusing to fall back to arbitrary placeholder values (ADR 0003)."
                  - listitem [ref=e596]:
                    - strong [ref=e597]: Protected Executed Paths (refuses unreviewed execution)
                    - text: ": The Guardrail verifies that all executed paths (scripts, selectors, unit files) are protected by GitHub rulesets and clean against reviewed git refs (ADR 0026)."
                  - listitem [ref=e598]:
                    - strong [ref=e599]: Review Capacity Bounds (refuses reviewer flooding)
                    - text: ": Dispatches halt when open proposals awaiting review reach the target's"
                    - code [ref=e600]: review_cap
                    - text: (ADR 0022), keeping unattended throughput aligned with human review capacity.
                  - listitem [ref=e601]:
                    - strong [ref=e602]: Bounded Retries (refuses infinite loops)
                    - text: ": Failed runs are retried at most once on the same branch before escalating to"
                    - code [ref=e603]: ready-for-human
                    - text: .
                - generic [ref=e604]:
