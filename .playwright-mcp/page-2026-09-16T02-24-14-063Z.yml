                    - /url: "#manifests-nothing-launches-from"
                - paragraph [ref=f3e1300]:
                  - text: "A machine usually reads more manifests than it launches from: a refs file that systemd units, a deploy script, or a status page resolve for themselves. No harness names it, so"
                  - code [ref=f3e1301]: va secrets validate
                  - text: "— the check you run after touching the vault — never looked at it, and reported every harness green while the units reading that file were down. That is what happened on 2026-09-03: a deleted vault item took four units out for six hours, and the documented gate said everything was fine."
                - paragraph [ref=f3e1302]: "Record those files, repeatably, and validate covers them:"
                - generic [ref=f3e1303]:
                  - generic [ref=f3e1304]:
                    - generic [ref=f3e1305]: "# /etc/vaulted-agent/defaults.conf"
                    - text: extra_manifest = /srv/orchestration/env.tpl extra_manifest = /etc/other/refs.env = plainfile
                  - button "Copy code to clipboard" [ref=f3e1307] [cursor=pointer]
                - paragraph [ref=f3e1311]:
                  - text: A relative path resolves against the manifest directory; the backend defaults to
                  - code [ref=f3e1312]: default_backend
                  - text: and may be named per entry.
                  - code [ref=f3e1313]: va secrets validate
                  - text: "then names every file it checked, pass or fail, and exits non-zero on any reference it could not resolve — so it is usable from a timer:"
                - generic [ref=f3e1314]:
                  - code [ref=f3e1316]: "claude (/etc/vaulted-agent/manifests/full.env.tpl): ok (252 variable(s) resolved) /srv/orchestration/env.tpl: FAIL (…) CLOUD_BEAVER_DB_ADMIN_PASSWORD op://Orchestrator/db-admin/password"
                  - button "Copy code to clipboard" [ref=f3e1318] [cursor=pointer]
                - paragraph [ref=f3e1322]:
                  - text: An extra manifest is validated and nothing else. It has no command, does not appear in
                  - code [ref=f3e1323]: va
