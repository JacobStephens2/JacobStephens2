                  - text: ", never sourced. That is the whole of the safety argument, and it would hold just as well for JSON or a whitespace-aligned table. Sourcing is what would be unsafe - it turns the config file into arbitrary shell executed as the account holding the vault token - and it is what most shell projects do."
                - paragraph [ref=f3e1283]:
                  - text: Given that, the choice among safe formats is about editing failure modes, and drop-in
                  - code [ref=f3e1284]: key = value
                  - text: "files win on three:"
                - list [ref=f3e1285]:
                  - listitem [ref=f3e1286]:
                    - text: A structured format (JSON, YAML, TOML) needs a parser. In bash that means shelling out to
                    - code [ref=f3e1287]: python3
                    - text: or
                    - code [ref=f3e1288]: jq
                    - text: in the launch path, then getting values back into the shell without
                    - code [ref=f3e1289]: eval
                    - text: . It is doable, but adding an interpreter to the critical path of a credential launcher is a poor trade for syntax. JSON also has no comments, and the config deserves them.
                  - listitem [ref=f3e1290]: An aligned table makes column position load-bearing. Someone tidying the alignment can shift a field, and a value can never contain a space.
                  - listitem [ref=f3e1291]:
                    - text: Drop-in files make adding a harness a new file rather than an edit to a shared one, which is how
                    - code [ref=f3e1292]: sudoers.d
                    - text: and
                    - code [ref=f3e1293]: systemd
                    - text: units already work, and they map one-to-one onto the symlink and the sudoers line.
                - paragraph [ref=f3e1294]: "So: yes, the spacing in the examples is purely cosmetic, and no, the free-form-ness was never what made it safe."
                - generic [ref=f3e1295]:
                  - heading "Manifests nothing launches from" [level=3] [ref=f3e1296]
