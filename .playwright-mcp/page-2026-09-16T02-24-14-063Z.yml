                - paragraph [ref=f3e1106]:
                  - code [ref=f3e1107]: va update
                  - text: installs the requested release, then uses that release's automatic defaults (shared with the installer) to add missing Harnesses for detected agents (including Muse). Existing profiles are preserved, including custom commands and Manifest choices. The updater does not run
                  - code [ref=f3e1108]: install.sh
