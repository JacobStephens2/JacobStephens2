                  - link "ADR-0006" [ref=f3e1325] [cursor=pointer]:
                    - /url: /JacobStephens2/vaulted-agent/blob/main/docs/adr/0006-validate-every-manifest-the-machine-reads.md
                  - text: ". A recorded path that is missing, or a line that cannot be parsed, is a failure rather than a skip: an operator who lists a file believes it is being checked."
