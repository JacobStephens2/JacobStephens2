                - paragraph [ref=f3e1109]:
                  - text: When all existing Harnesses agree on a Backend and Manifest, new Harnesses use that pair. If they disagree, cannot be read, or none exist, new Harnesses start with
                  - code [ref=f3e1110]: plainfile
                  - text: and a verified empty
                  - code [ref=f3e1111]: empty.env
                  - text: ; output tells you to configure their Backend and Manifest. Existing nonempty
                  - code [ref=f3e1112]: empty.env
                  - text: files are refused as starters. Agent-specific aliases and permission settings from other profiles are not copied. New Harnesses use the installer’s default command and caller directory.
                - paragraph [ref=f3e1113]:
                  - text: Root-owned machine configuration triggers a sudo retry. Discovery considers the configured Service user (or the invoking user under sudo), their local binary directories, and existing Harness
                  - code [ref=f3e1114]: bin
                  - text: directories. Custom config directories must be writable by the caller; their paths are not forwarded through sudo.
                - paragraph [ref=f3e1115]:
                  - code [ref=f3e1116]: va update --sync-harnesses
                  - text: adds missing Harnesses without downloading or replacing the binary.
                  - code [ref=f3e1117]: "--check"
                  - text: and
                  - code [ref=f3e1118]: "--dry-run"
                  - text: leave installed files and configuration unchanged. Downgrading to a release without Harness sync support preserves configuration and reports that sync was skipped.
                - paragraph [ref=f3e1119]:
                  - strong [ref=f3e1120]: "First upgrade from v0.4.23 or earlier:"
                  - text: the old updater only replaces the binary. Once the new binary is installed, run
                  - code [ref=f3e1121]: va update --sync-harnesses
                  - text: (or
